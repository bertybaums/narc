networks:
  narc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/24

services:
  narc:
    build: .
    ports:
      - "8100:8000"
    volumes:
      - ./narc.db:/app/narc.db
      - ./data:/app/data
      - ./inspect.html:/app/inspect.html
      # Narrate study DB: mount the directory (not the file) so WAL files persist on the host
      - ./narrate_data:/app/narrate_data
      # Prototype tab DB (NHM simulator runs): own directory, never narc.db
      - ./proto_data:/app/proto_data
    environment:
      - NARC_SECRET_KEY=${NARC_SECRET_KEY}
      - MINDROUTER_API_KEY=${MINDROUTER_API_KEY}
      # Agreed MindRouter working limit (ceiling 300/min; 100/min kept as buffer)
      - MINDROUTER_RATE_LIMIT_PER_MIN=200
    networks:
      - narc-net
    restart: unless-stopped
